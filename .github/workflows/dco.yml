# .github/workflows/dco.yml
name: DCO
on:
  pull_request:
    branches:
      - main

permissions: read-all

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.x
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    - name: Check DCO
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Exclude the Copilot automated bot from DCO sign-off requirement.
        # Bot-authored commits are overseen by human reviewers before merging.
        DCO_CHECK_EXCLUDE_EMAILS: '198982749+Copilot@users.noreply.github.com'
      run: |
        pip3 install -U dco-check
        dco-check
